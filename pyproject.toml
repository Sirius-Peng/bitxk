[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitxk"
version = "0.1.0"
description = "北京理工大学（wisedu xsxkapp）选课系统余量轮询与自动选课工具"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bitxk contributors" }]
keywords = ["bit", "北京理工大学", "选课", "抢课", "wisedu", "xsxkapp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Environment :: Console",
]
dependencies = [
    "requests>=2.28",
    "pycryptodome>=3.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.0"]
ui = ["rich>=13.0"]

[project.scripts]
bitxk = "bitxk.cli:main"

[project.urls]
Homepage = "https://github.com/example/bitxk"

[tool.setuptools.packages.find]
include = ["bitxk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:bitxk.*"]
