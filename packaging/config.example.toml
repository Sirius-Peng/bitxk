# ============================================================
#  BIT 选课助手 配置文件示例
#
#  用法：把本文件复制为 config.toml，放在可执行文件同目录，
#        然后按下面的注释填写。也可以直接在图形界面里改，
#        那里点「保存配置」会写出一份同样的 config.toml。
# ============================================================

# ============================================================
# 北京理工大学 本科生选课助手 配置文件
# 适用系统：xk.bit.edu.cn/xsxkapp（本科选课系统）
# 所有时间单位均为秒。
# ============================================================

[account]
# 本科生学号 / 统一身份认证密码。
# 也可以改用环境变量 BITXK_USERNAME、BITXK_PASSWORD，那样更安全
# （密码不会留在文件里，也不会进 shell 历史）。
username = ""
password = ""

[poll]
# 轮询间隔（秒）。这是学校的生产服务器，请勿设得太小。
# 1.5 ~ 3 秒是合理区间；代码层拒绝低于 0.5。
interval = 2.0

# 任意两次请求之间的最小间隔（秒）。多门课时用它做全局限速。
min_request_interval = 0.8

# 间隔抖动（秒）：实际等待 = interval + random(0, jitter)。
# 避免所有客户端在同一毫秒发出请求。
jitter = 0.5

# 最长轮询时长（秒）。0 表示不限制。默认 4 小时。
max_duration = 14400

# 连续失败多少次后退出（成功一次即归零）。
max_consecutive_errors = 30

# 被限流后的冷却时间（秒）。
rate_limit_cooldown = 30.0

# 会话使用多久后主动重新登录（秒）。
relogin_after = 600

[http]
timeout = 10.0
max_retries = 3

# 校外访问用：填本地 VPN / 代理地址，例如 "http://127.0.0.1:7890"。
# 注意 webvpn.bit.edu.cn 是网页版网关，不能直接填在这里；
# 校外最省事的做法是先在浏览器里登录选课系统，
# 再用 --token / --cookie 手动导入登录态（见 README）。
proxy = ""
verify_ssl = true

[notify]
# 抢到课时的终端响铃
sound = true
# 抢到第一门就退出（false = 继续抢配置里的其它课）
stop_on_success = false

# ============================================================
# 要盯的课程。想盯几门就写几个 [[courses]]，可并发轮询
# （受 min_request_interval 全局限速）。
#
#   name      课程名，必须与选课系统页面显示的完全一致
#   type      教学班类型，共 8 种：
#               XGXK  校公选课      TYKC  体育课程
#               FANKC 方案内课程    FAWKC 方案外课程
#               CXKC  重修课程      FXKC  辅修课程
#               TJKC  推荐课程      QXKC  全校课程
#   priority  优先级，数字越小越先选（默认 100）
#   teachers  只选指定老师（可选，支持部分匹配，如 "张"）
#   classes   只选指定教学班 ID（可选，多个用逗号分隔）
#   enabled   是否启用（默认 true）
# ============================================================

# —— 校公选课 ——
[[courses]]
name = "科幻文学"
type = "XGXK"
priority = 100
enabled = true

# —— 体育课（注意名字里带 "体育/" 前缀，与系统显示保持一致）——
# [[courses]]
# name = "体育/羽毛球"
# type = "TYKC"
# priority = 50
# enabled = true

# —— 方案内课程 ——
# [[courses]]
# name = "数据结构与算法"
# type = "FANKC"
# priority = 20
# enabled = true

# —— 只认某个老师的课 ——
# [[courses]]
# name = "大学物理"
# type = "FANKC"
# priority = 30
# teachers = ["李"]
# enabled = true
